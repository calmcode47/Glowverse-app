name: Automated Database Backup

on:
  schedule:
    # Daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to backup'
        required: true
        type: choice
        options:
          - production
          - staging
      backup_type:
        description: 'Backup type'
        required: true
        type: choice
        options:
          - full
          - incremental

jobs:
  backup:
    name: Database Backup
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PRODUCTION_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PRODUCTION_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Install GPG for encryption
        run: |
          sudo apt-get install -y gnupg
      
      - name: Run backup script
        run: |
          chmod +x scripts/backup-database.sh
          ./scripts/backup-database.sh \
            ${{ github.event.inputs.environment || 'production' }} \
            ${{ github.event.inputs.backup_type || 'full' }}
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          STAGING_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      
      - name: Verify backup
        run: |
          # List recent backups
          ENVIRONMENT=${{ github.event.inputs.environment || 'production' }}
          echo "Recent backups for $ENVIRONMENT:"
          aws s3 ls s3://glowverse-backups-$ENVIRONMENT/ --recursive | tail -n 5
      
      - name: Cleanup old backups
        run: |
          ENVIRONMENT=${{ github.event.inputs.environment || 'production' }}
          BUCKET="s3://glowverse-backups-$ENVIRONMENT"
          
          echo "Cleaning up backups older than 30 days..."
          
          # Get current timestamp
          CURRENT_TIME=$(date +%s)
          RETENTION_SECONDS=$((30 * 24 * 60 * 60))  # 30 days
          
          # List and delete old backups
          aws s3 ls $BUCKET/ | while read -r line; do
            FILE_DATE=$(echo $line | awk '{print $1" "$2}')
            FILE_NAME=$(echo $line | awk '{print $4}')
            
            if [ ! -z "$FILE_NAME" ]; then
              FILE_TIME=$(date -d "$FILE_DATE" +%s 2>/dev/null || echo "0")
              AGE=$((CURRENT_TIME - FILE_TIME))
              
              if [ $AGE -gt $RETENTION_SECONDS ]; then
                echo "Deleting old backup: $FILE_NAME (age: $((AGE / 86400)) days)"
                aws s3 rm $BUCKET/$FILE_NAME
              fi
            fi
          done
      
      - name: Notify Slack - Success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Database backup completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Database Backup Successful*\n\nEnvironment: `${{ github.event.inputs.environment || 'production' }}`\nType: `${{ github.event.inputs.backup_type || 'full' }}`\nWorkflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
      
      - name: Send failure notification
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Database backup failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Database Backup Failed* ⚠️\n\nEnvironment: `${{ github.event.inputs.environment || 'production' }}`\nType: `${{ github.event.inputs.backup_type || 'full' }}`\nWorkflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\n\n*ACTION REQUIRED:* Check workflow logs immediately!"
                  }
                }
              ]
            }
  
  verify-backup:
    name: Verify Backup Integrity
    runs-on: ubuntu-latest
    needs: backup
    if: github.event.inputs.environment == 'production' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PRODUCTION_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PRODUCTION_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gnupg bc
      
      - name: Get latest backup
        id: latest-backup
        run: |
          ENVIRONMENT=${{ github.event.inputs.environment || 'production' }}
          LATEST=$(aws s3 ls s3://glowverse-backups-$ENVIRONMENT/ | sort | tail -n 1 | awk '{print $4}')
          echo "backup=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest backup: $LATEST"
      
      - name: Verify backup
        run: |
          chmod +x scripts/verify-backup.sh
          ./scripts/verify-backup.sh ${{ steps.latest-backup.outputs.backup }}
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
